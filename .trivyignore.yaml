  - id: CVE-2026-11822
    statement: |
      libsqlite3-0 3.46.1-7+deb13u1 (fixed: 3.46.1-7+deb13u2) — 細工した FTS5 全文検索データによる任意コード実行 (HIGH)。

      見逃している内容: 同 base image の libsqlite3-0。悪用には攻撃者制御の SQLite
