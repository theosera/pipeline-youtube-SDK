  - id: CVE-2026-13221
    statement: |
      perl-base 5.40.1-6 (fixed: 5.40.1-6+deb13u1) — 巨大な正規表現の誤処理 (CRITICAL)。

      見逃している内容: 同 base image の perl-base (Debian の Essential パッケージ。dpkg
      の maintainer script 用に必ず入る)。悪用には perl に攻撃者制御の入力 (正規表現 /
      tar アーカイブ / 圧縮ストリーム / pack 書式 / Storable 直列化) を処理させる必要が
      ある。capture image の実行時エントリは yt-dlp / ffmpeg / gif2webp だけ
      (docker/Dockerfile.capture・DockerCaptureBackend が argv を全部渡す)。
      perl は呼ばない。それでも入っている事実は消さずに記録する。

      解消条件: 上流 python:3.14-slim が perl-base >= 5.40.1-6+deb13u1 を含む digest を
