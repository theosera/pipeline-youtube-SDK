repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict

  # Secret scanning (.env values, API keys, OAuth client secrets, private keys,
  # tokens, etc.). Enforced in CI: the `Secret scan (gitleaks)` job runs the
  # gitleaks-ci alias below over the git history. The local `gitleaks` hook
  # blocks a commit only where pre-commit hooks are enabled — that is opt-in
  # (`uv sync` does not install them). Run `pre-commit autoupdate` to pin the
  # latest gitleaks release.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
      # CI variant. The hook above runs `gitleaks protect --staged`, which only
      # sees staged changes — in CI nothing is staged, so it passes without
      # scanning anything. This alias scans the git history instead (tracked
      # content only, so the uv-created .venv is not picked up). Manual stage
      # keeps it out of local commits; CI runs it with
      # `pre-commit run gitleaks-ci --hook-stage manual` on a full-depth clone.
      - id: gitleaks
        alias: gitleaks-ci
        name: Detect hardcoded secrets (git history, CI)
        entry: gitleaks detect --redact --verbose
        stages: [manual]
        # A CI checkout has a clean index, so pre-commit finds no candidate
        # files and would skip the hook ("(no files to check)Skipped").
        always_run: true
