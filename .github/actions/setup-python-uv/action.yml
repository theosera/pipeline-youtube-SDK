name: 'Setup Python via uv'
description: >-
  Install uv (with cache), provision the requested Python version, and sync
  project dependencies. The repository must be checked out by the calling
  workflow before invoking this action.

inputs:
  python-version:
    description: 'Python version passed to `uv python install`.'
    required: false
    default: '3.13'

runs:
  using: composite
  steps:
    # SHA-pinned to mitigate supply-chain attacks against this third-party
    # action. Bump the SHA and the trailing version comment together;
    # Dependabot will open such PRs (see .github/dependabot.yml).
    # uv binary version is pinned via [tool.uv] required-version in pyproject.toml.
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: true
        # v9.0.0 flipped the `prune-cache` default from true to false to ease
        # load on PyPI. Set it back explicitly: without pruning, the cache we
        # upload keeps every downloaded wheel/sdist for the full dependency
        # tree (torch + the CUDA stack via the `whisper` extra), which blows
        # through the repo's 10 GB Actions cache budget and evicts entries the
        # other jobs rely on. Drop this line only alongside a deliberate
        # measurement of cache size.
        prune-cache: true

    - name: Set up Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: uv sync
