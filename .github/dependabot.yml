version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
　　　　　　　　　　　
  - package-ecosystem: "github-actions"
    # `/` only reaches .github/workflows/*.yml for this ecosystem — it does NOT
    # descend into composite actions. `.github/actions/setup-python-uv` needs
    # its own entry so Dependabot picks up that folder's action.yml; without it
    # the composite action silently drifts (it sat on setup-uv v8.2.0 while
    # release.yml had already moved to v8.3.2). Listed under the plural
    # `directories` key so both paths stay inside the same group below and a
    # shared action is bumped in one PR instead of two.
    directories:
      - "/"
      - "/.github/actions/setup-python-uv"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    # Group minor/patch action bumps into a single PR so multi-step actions stay
    # version-consistent — e.g. codeql-action/init and codeql-action/analyze must
    # be the same release or the CodeQL job fails with a configuration error
    # (see the split #100/#101 that each failed alone). Major bumps are left
    # ungrouped so they remain individual, opt-in, reviewable PRs.
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Track the digest-pinned base image in docker/Dockerfile.capture so a newer
  # python:3.13-slim digest (security/patch updates) still reaches us despite the
  # pin. Dependabot proposes the digest bump as a reviewable PR.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
