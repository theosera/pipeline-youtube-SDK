# Paths whose secret-scanning matches are public by construction.
#
# pipeline_youtube/transcript/innertube.py pins the InnerTube API key and client
# identity that ship inside YouTube's own iOS app. The value belongs to Google,
# not to the operator: it is extractable from the published app, is used as-is by
# other clients (yt-dlp among them), and exists here only so the request looks
# like the iOS client — which is what avoids the PO token requirement. There is
# nothing to rotate and removing it breaks the innertube transcript fetcher.
#
# Keep this list to that single file. A broader pattern would also hide a real
# credential if one were ever committed nearby.
paths-ignore:
  - "pipeline_youtube/transcript/innertube.py"
